# Supabase CLI config.
#
# invite-user authenticates the caller itself (it reads the admin's JWT and
# checks role inside), so platform-level JWT verification must be OFF. With it
# ON, Supabase's gateway rejects the browser's CORS preflight (an OPTIONS
# request with no Authorization header) and the client shows
# "Failed to send a request to the Edge Function".
[functions.invite-user]
verify_jwt = false

# Same reason as invite-user above — authenticates the caller itself.
[functions.admin-password-reset]
verify_jwt = false

# Same reason as invite-user above — authenticates the caller itself.
[functions.unlock-user]
verify_jwt = false

# Called from the login screen before the caller has ANY session (step 1 of
# the two-step login — see src/pages/Login.tsx) — there is no JWT to verify.
[functions.check-login-email]
verify_jwt = false

# Same reason as check-login-email — called right after a sign-in attempt
# that may well have just failed, so there may be no valid session.
[functions.record-login-attempt]
verify_jwt = false

# Cron-triggered (pg_cron -> net.http_post), no interactive user session to
# carry a Supabase JWT — auth is the X-Sync-Token shared-secret header
# checked in the function itself instead.
[functions.skybitz-tank-sync]
verify_jwt = false

# Same reason as skybitz-tank-sync — now also called unattended by the Data
# Connections dispatcher, in addition to its existing interactive callers.
[functions.droptop-sync-usage]
verify_jwt = false

# Called only by pg_cron -> net.http_post, on the fixed cadence set up once
# in Supabase's SQL editor — never edited again after that.
[functions.data-connection-dispatcher]
verify_jwt = false

# Called by the dispatcher above (unattended) and by the Data Connections
# tab's "Run Now" (interactive) — same reason as the others.
[functions.run-automated-checks]
verify_jwt = false

# Same reason as droptop-sync-usage — called unattended by the dispatcher
# (X-Sync-Token) in addition to interactive "Run Now"/PO Status "Sync Now"
# calls. Missed when the function was first added — Supabase's own
# dashboard "Verify JWT" toggle was flipped off manually as a workaround;
# this makes that the tracked, reproducible source of truth instead.
[functions.droptop-sync-purchase-orders]
verify_jwt = false

[functions.droptop-sync-customers]
verify_jwt = false

[functions.droptop-sync-orders]
verify_jwt = false

[functions.droptop-sync-packages]
verify_jwt = false

# Same dual-auth pattern as the other droptop-sync-* functions above.
[functions.droptop-sync-staff-time-clock]
verify_jwt = false

# Same dual-auth pattern as the droptop-sync-* functions above (shared
# X-Sync-Token OR a real user JWT checked in the function itself).
[functions.geocode-orders]
verify_jwt = false

# Same dual-auth pattern as run-automated-checks — the dispatcher (shared
# DATA_CONNECTION_DISPATCH_SECRET) plus the Data Connections "Refresh
# Rollups Now" button (real user JWT). No cron entry of its own; runs on
# the dispatcher's existing schedule via a data_connection_schedules row.
[functions.heatmap-rollup-refresh]
verify_jwt = false

# Same dual-auth pattern as heatmap-rollup-refresh (dispatcher's shared
# secret, or a real logged-in user's JWT for Data Connections' own "Run
# Now"). Replaces the old client-side mondayService.ts / Location Data
# Sources UI entirely.
[functions.monday-sync-locations]
verify_jwt = false

# Droptop calls this directly with no Supabase auth at all (Droptop's own
# webhook config has no way to attach a JWT or custom header) — the
# function name's own random suffix is the only credential. See that
# file's own header comment before ever renaming or exposing this.
[functions.droptop-webhook-b7a51c94196e610b]
verify_jwt = false

# Same dual-auth pattern as heatmap-rollup-refresh — the dispatcher
# (shared secret) or a real logged-in user's "Run Now" from the Alerts tab.
[functions.staffing-alerts-refresh]
verify_jwt = false
