# Supabase CLI config.
#
# invite-user authenticates the caller itself (it reads the admin's JWT and
# checks role inside), so platform-level JWT verification must be OFF. With it
# ON, Supabase's gateway rejects the browser's CORS preflight (an OPTIONS
# request with no Authorization header) and the client shows
# "Failed to send a request to the Edge Function".
[functions.invite-user]
verify_jwt = false

# Same reason as invite-user above — authenticates the caller itself.
[functions.admin-password-reset]
verify_jwt = false

# Cron-triggered (pg_cron -> net.http_post), no interactive user session to
# carry a Supabase JWT — auth is the X-Sync-Token shared-secret header
# checked in the function itself instead.
[functions.skybitz-tank-sync]
verify_jwt = false

# Same reason as skybitz-tank-sync — now also called unattended by the Data
# Connections dispatcher, in addition to its existing interactive callers.
[functions.droptop-sync-usage]
verify_jwt = false

# Called only by pg_cron -> net.http_post, on the fixed cadence set up once
# in Supabase's SQL editor — never edited again after that.
[functions.data-connection-dispatcher]
verify_jwt = false

# Called by the dispatcher above (unattended) and by the Data Connections
# tab's "Run Now" (interactive) — same reason as the others.
[functions.run-automated-checks]
verify_jwt = false
